    <!-- Analytics Tracking Script (MIM standard: visits, tel: clicks, mailto: clicks) -->
    <script>
    (function() {
      setTimeout(function() {
        document.body.addEventListener('click', function(e) {
          var target = e.target;
          var maxDepth = 5;
          var depth = 0;

          while (target && depth < maxDepth) {
            if (target.tagName === 'A' && target.href && target.href.startsWith('tel:')) {
              fetch('/api/track-call.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  page_url: window.location.href,
                  page_title: document.title,
                  referrer: document.referrer,
                  user_agent: navigator.userAgent
                })
              }).catch(function(err) { console.log('Call tracking error:', err); });
              break;
            }

            if (target.tagName === 'A' && target.href && target.href.startsWith('mailto:')) {
              fetch('/api/track-email.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  page_url: window.location.href,
                  page_title: document.title,
                  referrer: document.referrer,
                  user_agent: navigator.userAgent
                })
              }).catch(function(err) { console.log('Email tracking error:', err); });
              break;
            }

            target = target.parentElement;
            depth++;
          }
        }, true);
      }, 2000);

      window.addEventListener('load', function() {
        fetch('/api/track-visit.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            page_url: window.location.href,
            page_title: document.title,
            referrer: document.referrer,
            user_agent: navigator.userAgent
          })
        }).catch(function(err) { console.log('Visit tracking error:', err); });
      });
    })();
    </script>
